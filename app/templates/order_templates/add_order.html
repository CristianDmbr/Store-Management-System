<!DOCTYPE html>
<head>
    <title>
        Add Order
    </title>
</head>
<body>
    <h1>Add at {{ restaurant.restaurant_name }}</h1>
    <hr>

    <form method = "POST">
        {% csrf_token %}

        {{ form.as_p }}

        <form method = "POST">
            <button type = "submit">Add</button>
        </form>
    </form>

    <hr>
    {% if is_supervisor %}
        <form action="{% url 'all_orders_list' %}" method = "GET">
            <button type = "submit">Back</button>
        </form>
    {% endif %}

</body>
