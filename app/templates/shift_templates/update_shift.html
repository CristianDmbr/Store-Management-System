<!DOCTYPE html>
<head>
    <title>Update Shift</title>
</head>
<body>
    <h1>Update {{staff.name}} 's shift for {{shift.start_time}} - {{shift.end_time}}</h1>
    <hr>
    <form method = "POST">
        {% csrf_token %}

        {{ form.as_p }}
        <button type="submit">Update</button>
    </form>
    <hr>
    <form action="{% url 'shift_list_full' %}" method = "GET">
        <button type="submit">Shift List</button>
    </form>
</body>
